<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DSP-JAMAKY — бытовая техника оптом, Москва</title>
<meta name="description" content="Официальный дистрибьютор DSP и JAMAKY. Бытовая техника оптом из Китая, доставка по всей России. ТК «Южные ворота», 8 линия, павильон 18-20.">
<meta property="og:title" content="DSP-JAMAKY — бытовая техника оптом">
<meta property="og:image" content="/img/kd-2063.jpg">
<link rel="icon" href="/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --ink:#0e0f11; --paper:#f3f4f5; --white:#fff; --steel:#c9cdd3; --line:#dcdfe3; --muted:#5d636b;
  --tag:#ffd60a; --tag-ink:#1a1500; --ok:#1c7a3d;
  --display:"Oswald","Arial Narrow",Impact,sans-serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --wrap:1180px; --gut:16px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
img{display:block;max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--gut)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.05;margin:0;letter-spacing:.005em}
h1{font-size:clamp(38px,8vw,76px);font-weight:700}
h2{font-size:clamp(26px,4.4vw,38px)}
h3{font-size:20px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;text-decoration:none;cursor:pointer;border-radius:3px}
.btn:hover{background:#25282d}
.btn.tag{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.btn.tag:hover{filter:brightness(.95)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.sm{min-height:38px;padding:0 14px;font-size:15px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* header */
header.top{background:#000;color:#fff;position:sticky;top:0;z-index:30}
.top .row{display:flex;align-items:center;gap:20px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{height:42px;width:auto}
.brand span{font-family:var(--display);font-weight:500;font-size:15px;line-height:1.1;color:var(--steel);display:none}
nav.main{display:flex;gap:4px;margin-left:12px}
nav.main a{color:var(--steel);text-decoration:none;padding:10px 12px;font-weight:500;border-bottom:2px solid transparent}
nav.main a:hover,nav.main a[aria-current=page]{color:#fff;border-color:var(--tag)}
.top .sp{flex:1}
.cartbtn{display:flex;align-items:center;gap:10px;background:var(--tag);color:var(--tag-ink);border:0;min-height:44px;padding:0 16px;font-weight:600;cursor:pointer;border-radius:3px}
.cartbtn b{font-family:var(--display);font-size:18px;font-weight:600}
.cartbtn .n{min-width:22px;height:22px;border-radius:11px;background:var(--ink);color:#fff;font-size:13px;display:grid;place-items:center;padding:0 6px}
@media(min-width:760px){.brand span{display:block}}
@media(max-width:759px){
  .top .row{flex-wrap:wrap;gap:0 12px;padding-top:6px}
  nav.main{order:3;width:100%;margin:0 -8px;overflow-x:auto}
  nav.main a{padding:8px 8px;white-space:nowrap;font-size:15px}
}

/* hero */
.hero{background:var(--white);border-bottom:1px solid var(--line)}
.hero .grid{display:grid;gap:28px;padding-block:36px 44px}
.hero .grid>*{min-width:0}
.hero p.lead{font-size:19px;max-width:34ch;margin:18px 0 26px;color:#2a2d31}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
.heroq{display:flex;margin-top:26px;border:2px solid var(--ink);background:var(--white);max-width:520px;border-radius:3px}
.heroq input{flex:1;border:0;padding:0 14px;min-height:50px;background:transparent;min-width:0}
.heroq input:focus-visible{outline:none;box-shadow:none}
.heroq:focus-within{outline:3px solid var(--tag);box-shadow:0 0 0 5px var(--ink)}
.heroq button{border:0;background:var(--ink);color:#fff;padding:0 18px;font-weight:600;cursor:pointer}
.wall{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:46px;gap:8px}
.wall a{position:relative;background:#fff;border:1px solid var(--line);overflow:hidden;text-decoration:none;border-radius:3px}
.wall a:nth-child(1){grid-column:1/4;grid-row:1/6}
.wall a:nth-child(2){grid-column:4/7;grid-row:1/4}
.wall a:nth-child(3){grid-column:4/7;grid-row:4/8}
.wall a:nth-child(4){grid-column:1/4;grid-row:6/9}
.wall a:nth-child(5){grid-column:1/3;grid-row:9/12}
.wall a:nth-child(6){grid-column:3/7;grid-row:8/12}
.wall img{width:100%;height:100%;object-fit:cover}
.wall .pt{position:absolute;left:0;bottom:0}
@media(max-width:600px){.wall .pt{font-size:15px;padding:3px 7px 4px}.wall .pt small{display:none}}
@media(min-width:900px){.hero .grid{grid-template-columns:1.05fr 1fr;align-items:center;gap:48px;padding-block:56px 64px}}

/* price tag */
.pt{background:var(--tag);color:var(--tag-ink);padding:5px 10px 6px;display:inline-flex;align-items:baseline;gap:5px;line-height:1;font-family:var(--display);font-weight:700;font-size:22px;border-top-right-radius:3px}
.pt small{font-family:var(--body);font-weight:500;font-size:12px}
.pt.big{font-size:44px;padding:10px 16px 12px;border-radius:3px}
.pt.big small{font-size:16px}

/* sections */
section.blk{padding:44px 0}
.shead{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:20px}
.shead a{font-weight:600}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.cats{grid-template-columns:repeat(3,1fr)}}
.cat{display:flex;gap:14px;align-items:center;background:var(--white);border:1px solid var(--line);padding:10px;text-decoration:none;border-radius:3px}
.cat:hover{border-color:var(--ink)}
.cats>*{min-width:0}
.cat>div{min-width:0}
.cat b{overflow-wrap:break-word}
@media(max-width:520px){.cats{grid-template-columns:1fr}.cat{gap:12px;padding:8px}.cat img{width:52px!important;height:52px!important}.cat b{font-size:17px}}
.cat img{width:72px;height:72px;object-fit:cover;background:var(--paper);flex:none;border-radius:2px}
.cat b{font-family:var(--display);font-size:19px;font-weight:600;line-height:1.1;display:block}
.cat span{color:var(--muted);font-size:14px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity}
.rail>*{scroll-snap-align:start}
@media(min-width:900px){.rail{grid-auto-columns:calc(25% - 8px)}}

/* product card */
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:760px){.grid4{grid-template-columns:repeat(3,1fr);gap:14px}}
@media(min-width:1040px){.grid4{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--white);border:1px solid var(--line);display:flex;flex-direction:column;border-radius:3px;min-width:0}
.card .ph{position:relative;aspect-ratio:1/1;background:#fff;display:block;overflow:hidden;border-bottom:1px solid var(--line)}
.card .ph img{width:100%;height:100%;object-fit:contain}
.card .ph .pt{position:absolute;left:0;bottom:0}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.card .nm{font-weight:600;line-height:1.25;text-decoration:none;display:block}
.card .nm:hover{text-decoration:underline}
.card .mt{font-size:13px;color:var(--muted)}
.card .box{font-size:13.5px;margin-top:4px}
.card .box b{font-family:var(--display);font-size:16px;font-weight:600}
.card .act{margin-top:auto;padding-top:10px}
.step{display:flex;align-items:stretch;border:2px solid var(--ink);border-radius:3px;overflow:hidden}
.step button{width:42px;border:0;background:var(--ink);color:#fff;font-size:20px;cursor:pointer;line-height:1}
.step button:hover{background:#25282d}
.step span{flex:1;display:flex;align-items:center;justify-content:center;font-weight:600;min-width:64px}
.step span small{font-weight:400;color:var(--muted);margin-left:4px;white-space:nowrap}
.add{width:100%}
.badge{position:absolute;right:8px;top:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:2px}

/* catalog */
.page-h{padding:28px 0 8px}
.filters{position:sticky;top:64px;z-index:20;background:var(--paper);padding:10px 0;border-bottom:1px solid var(--line);margin-bottom:16px}
@media(max-width:759px){.filters{top:104px}}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{white-space:nowrap;border:1.5px solid var(--ink);background:var(--white);padding:7px 14px;font-weight:500;cursor:pointer;border-radius:30px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
.frow{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:760px){.frow{grid-template-columns:2fr 1fr 1fr}}
.frow input,.frow select{width:100%;min-height:44px;padding:0 12px;border:1.5px solid var(--steel);background:var(--white);border-radius:3px}
.count{margin:0 0 12px;color:var(--muted);font-size:14px}
.empty{background:var(--white);border:1px dashed var(--steel);padding:36px 20px;text-align:center}
.more{display:flex;justify-content:center;margin:26px 0 8px}

/* product page */
.crumbs{padding:18px 0 6px;font-size:14px;color:var(--muted)}
.crumbs a{color:var(--muted)}
.prod{display:grid;gap:24px;padding:10px 0 40px}
@media(min-width:860px){.prod{grid-template-columns:1.1fr 1fr;gap:40px}}
.prod .pic{background:var(--white);border:1px solid var(--line);aspect-ratio:1/1;display:grid;place-items:center;border-radius:3px;overflow:hidden}
.prod .pic img{width:100%;height:100%;object-fit:contain}
.prod h1{font-size:clamp(30px,5vw,46px)}
.specs{width:100%;border-collapse:collapse;margin:18px 0;background:var(--white);border:1px solid var(--line)}
.specs td{padding:10px 14px;border-bottom:1px solid var(--line)}
.specs td:last-child{text-align:right;font-weight:600}
.specs tr:last-child td{border:0}
.buyrow{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.buyrow .step{min-width:150px}
.note{font-size:14px;color:var(--muted);margin-top:12px}

/* steps / contacts */
.steps{display:grid;gap:10px;counter-reset:s}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.stp{background:var(--white);border:1px solid var(--line);padding:18px;border-radius:3px;position:relative;counter-increment:s}
.stp::before{content:counter(s);font-family:var(--display);font-weight:700;font-size:40px;background:var(--tag);color:var(--tag-ink);display:inline-block;min-width:44px;text-align:center;line-height:1.15;padding:0 10px;margin-bottom:10px}
.stp p{margin:6px 0 0;color:#2f3338}
.brands{display:flex;flex-wrap:wrap;gap:10px}
.brands a{font-family:var(--display);font-weight:700;font-size:30px;padding:14px 26px;background:var(--ink);color:#fff;text-decoration:none;border-radius:3px}
.brands a:hover{background:var(--tag);color:var(--tag-ink)}
.contact{display:grid;gap:14px}
@media(min-width:860px){.contact{grid-template-columns:1fr 1.2fr}}
.addr{background:var(--ink);color:#fff;padding:26px;border-radius:3px}
.addr h2{color:#fff}
.addr p{margin:12px 0 0;color:var(--steel)}
.addr .big{font-family:var(--display);font-size:26px;color:#fff;font-weight:600;line-height:1.2;margin-top:14px}
.mgrs{display:grid;gap:10px;align-content:start}
.mgr{background:var(--white);border:1px solid var(--line);padding:14px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;border-radius:3px}
.mgr b{font-family:var(--display);font-size:22px;font-weight:600;flex:1;min-width:110px}
.mgr small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted)}
footer{background:#000;color:var(--steel);padding:30px 0 40px;margin-top:20px;font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;align-items:center}
footer a{color:#fff}

/* drawer */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none}
.ovl.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--white);z-index:51;display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease}
.drawer.on{transform:none}
.drawer .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .x{border:0;background:var(--paper);width:40px;height:40px;font-size:22px;cursor:pointer;border-radius:3px}
.drawer .bdy{flex:1;overflow:auto;padding:12px 16px}
.li{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.li img{width:64px;height:64px;object-fit:contain;background:#f7f8f9;border:1px solid var(--line)}
.li .nm{font-weight:600;line-height:1.25}
.li .r{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.li .step{transform:scale(.9);transform-origin:left}
.li .sum{font-family:var(--display);font-weight:600;font-size:18px}
.li .rm{border:0;background:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
.drawer .ft{padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.tot b{font-family:var(--display);font-size:28px}
.fld{display:block;margin-bottom:8px}
.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.fld input,.fld textarea{width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--steel);background:var(--white);border-radius:3px}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.err{color:#b3261e;font-size:14px;margin:6px 0 0;min-height:1.2em}
.done{text-align:center;padding:40px 8px}
.done .pt{margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;z-index:60;border-radius:3px;font-weight:500;max-width:90%}
.hide{display:none!important}
</style>
</head>
<body>
<header class="top">
  <div class="wrap row">
    <a class="brand" href="#/" aria-label="DSP-JAMAKY, на главную"><img src="/img/logo.jpg" alt="DSP Professional" width="80" height="41"><span>Бытовая техника<br>оптом</span></a>
    <nav class="main" aria-label="Разделы">
      <a href="#/" data-nav="home">Главная</a>
      <a href="#/catalog" data-nav="catalog">Каталог</a>
      <a href="#/order" data-nav="order">Как заказать</a>
      <a href="#/contacts" data-nav="contacts">Контакты</a>
    </nav>
    <span class="sp"></span>
    <button class="cartbtn" id="cartOpen" aria-label="Открыть корзину"><span>Корзина</span><span class="n" id="cartN">0</span><b id="cartSum" class="hide"></b></button>
  </div>
</header>

<main id="app"></main>

<footer>
  <div class="wrap">
    <div>© DSP-JAMAKY, официальный дистрибьютор. Москва, ТК «Южные ворота», 8 линия, павильон 18-20.</div>
    <div><a href="https://t.me/DSP_OFFICIAL_RU" rel="noopener">Telegram-канал</a> · <a href="https://www.instagram.com/dsp_russia" rel="noopener">Instagram</a></div>
  </div>
</footer>

<div class="ovl" id="ovl"></div>
<aside class="drawer" id="drawer" aria-label="Корзина" aria-hidden="true"></aside>
<div class="toast hide" id="toast" role="status"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#000000'); } catch(e){} }

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const plural = (n,a,b,c) => { n=Math.abs(n)%100; const m=n%10; return (n>10&&n<20)?c:m>1&&m<5?b:m==1?a:c; };

const MANAGERS = [
  {name:'Ислам', phone:'+7 925 451-06-00', wa:'79254510600', tg:'IslamDsp'},
  {name:'Рахим', phone:'+7 925 381-57-55', wa:'79253815755', tg:'mnvrkk'},
  {name:'Алим',  phone:'+7 925 257-66-26', wa:'79252576626', tg:'Alimdsp'},
];

let DATA = {cats:[], items:[]}, BY = {};
let cart = {};
try { cart = JSON.parse(localStorage.getItem('dsp_cart') || '{}'); } catch(e){}
const saveCart = () => { try { localStorage.setItem('dsp_cart', JSON.stringify(cart)); } catch(e){} };

const NOIMG = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#f1f2f4"/><g fill="none" stroke="#b6bbc2" stroke-width="5" stroke-linejoin="round"><path d="M50 70l50-24 50 24v62l-50 24-50-24z"/><path d="M50 70l50 24 50-24M100 94v62"/></g></svg>');
const imgTag = (p, cls='') => `<img class="${cls}" src="${esc(p.i||NOIMG)}" alt="${esc(p.n+' '+p.m)}" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${NOIMG}'">`;
const boxSum = p => p.p * p.k;
const tag = (p, big) => `<span class="pt${big?' big':''}">${rub(p.p)}<small>за шт</small></span>`;

/* ---------- cart ---------- */
const cartList = () => Object.entries(cart).filter(([id,q]) => q>0 && BY[id]).map(([id,q]) => ({p:BY[id], q}));
const cartTotals = () => cartList().reduce((a,{p,q}) => (a.boxes+=q, a.pcs+=q*p.k, a.sum+=q*boxSum(p), a), {boxes:0,pcs:0,sum:0});
function setQty(id, q){ q=Math.max(0,Math.min(9999,q|0)); if(q) cart[id]=q; else delete cart[id]; saveCart(); refresh(); }
function refresh(){
  const t = cartTotals();
  $('#cartN').textContent = t.boxes;
  const s = $('#cartSum'); s.textContent = rub(t.sum); s.classList.toggle('hide', !t.boxes);
  document.querySelectorAll('[data-act]').forEach(el => el.innerHTML = actHtml(el.dataset.act));
  if ($('#drawer').classList.contains('on')) renderDrawer(true);
}
function actHtml(id){
  const q = cart[id]||0;
  if(!q) return `<button class="btn add sm" data-add="${esc(id)}">В корзину</button>`;
  return `<div class="step"><button data-dec="${esc(id)}" aria-label="Меньше">−</button><span>${q}<small>кор.</small></span><button data-inc="${esc(id)}" aria-label="Больше">+</button></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.add) { setQty(b.dataset.add, 1); toast('Добавлено в корзину'); }
  else if(b.dataset.inc) setQty(b.dataset.inc, (cart[b.dataset.inc]||0)+1);
  else if(b.dataset.dec) setQty(b.dataset.dec, (cart[b.dataset.dec]||0)-1);
  else if(b.dataset.rm) setQty(b.dataset.rm, 0);
});
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.remove('hide'); clearTimeout(tt); tt=setTimeout(()=>t.classList.add('hide'),1600); }

/* ---------- drawer ---------- */
let lastFocus=null;
function openCart(){ lastFocus=document.activeElement; renderDrawer(); $('#ovl').classList.add('on'); const d=$('#drawer'); d.classList.add('on'); d.setAttribute('aria-hidden','false'); const f=d.querySelector('button,input'); f&&f.focus(); }
function closeCart(){ $('#ovl').classList.remove('on'); const d=$('#drawer'); d.classList.remove('on'); d.setAttribute('aria-hidden','true'); lastFocus&&lastFocus.focus&&lastFocus.focus(); }
$('#cartOpen').onclick = openCart; $('#ovl').onclick = closeCart;
document.addEventListener('keydown', e => { if(e.key==='Escape' && $('#drawer').classList.contains('on')) closeCart(); });
function renderDrawer(keepForm){
  const d = $('#drawer'), L = cartList(), t = cartTotals();
  let keep = {};
  if(keepForm){ ['name','phone','comment'].forEach(k => { const el=d.querySelector('[name='+k+']'); if(el) keep[k]=el.value; }); }
  if(!L.length){
    d.innerHTML = `<div class="hd"><h3>Корзина</h3><button class="x" aria-label="Закрыть" id="dx">×</button></div>
    <div class="bdy"><div class="empty"><p><b>В корзине пусто</b></p><p class="muted">Выберите технику в каталоге и добавьте её коробками.</p><a class="btn" href="#/catalog" id="toCat">Открыть каталог</a></div></div>`;
    $('#dx').onclick = closeCart; $('#toCat').onclick = closeCart; return;
  }
  d.innerHTML = `<div class="hd"><h3>Корзина</h3><button class="x" aria-label="Закрыть" id="dx">×</button></div>
  <div class="bdy">${L.map(({p,q}) => `<div class="li">${imgTag(p)}<div><div class="nm">${esc(p.n)} <span class="muted">${esc(p.m)}</span></div>
    <div class="muted" style="font-size:13px">${p.k} шт в коробке × ${rub(p.p)}</div>
    <div class="r"><div class="step"><button data-dec="${esc(p.id)}" aria-label="Меньше">−</button><span>${q}<small>кор.</small></span><button data-inc="${esc(p.id)}" aria-label="Больше">+</button></div><span class="sum">${rub(q*boxSum(p))}</span></div>
    <button class="rm" data-rm="${esc(p.id)}">Убрать</button></div></div>`).join('')}</div>
  <form class="ft" id="ordForm" novalidate>
    <div class="tot"><span class="muted">${t.boxes} ${plural(t.boxes,'коробка','коробки','коробок')} · ${t.pcs} шт</span><b>${rub(t.sum)}</b></div>
    <label class="fld"><span>Имя</span><input name="name" autocomplete="name" required></label>
    <label class="fld"><span>Телефон</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7" required></label>
    <label class="fld"><span>Город доставки или комментарий</span><textarea name="comment" rows="2"></textarea></label>
    <div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
    <div class="err" id="ordErr" role="alert"></div>
    <button class="btn tag" style="width:100%" id="ordGo" type="submit">Отправить заявку</button>
    <p class="note" style="margin:8px 0 0">Это заявка, не оплата. Менеджер подтвердит наличие, цену и доставку.</p>
  </form>`;
  $('#dx').onclick = closeCart;
  Object.entries(keep).forEach(([k,v]) => { d.querySelector('[name='+k+']').value = v; });
  $('#ordForm').onsubmit = submitOrder;
}
async function submitOrder(e){
  e.preventDefault();
  const f = e.target, name=f.name.value.trim(), phone=f.phone.value.trim(), err=$('#ordErr');
  if(!name) { err.textContent='Укажите имя'; f.name.focus(); return; }
  if(phone.replace(/\D/g,'').length < 10) { err.textContent='Укажите телефон, например +7 900 123-45-67'; f.phone.focus(); return; }
  err.textContent=''; const go=$('#ordGo'); go.disabled=true; go.textContent='Отправляем…';
  const items = cartList().map(({p,q}) => ({id:p.id, qty:q}));
  try{
    const r = await fetch('/api/order', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({initData: tg ? tg.initData : '', name, phone, comment: f.comment.value.trim(), website: f.website.value, items})});
    if(!r.ok) throw new Error(r.status);
    const t = cartTotals(); cart = {}; saveCart();
    $('#cartN').textContent = 0; $('#cartSum').classList.add('hide');
    $('#drawer').innerHTML = `<div class="hd"><h3>Заявка отправлена</h3><button class="x" aria-label="Закрыть" id="dx">×</button></div>
      <div class="bdy"><div class="done"><span class="pt big">${rub(t.sum)}</span><h3>Спасибо, ${esc(name)}!</h3><p class="muted">Менеджер свяжется с вами по номеру ${esc(phone)}, подтвердит наличие и расскажет про доставку.</p><button class="btn" id="dd">Вернуться в каталог</button></div></div>`;
    $('#dx').onclick = closeCart; $('#dd').onclick = () => { closeCart(); location.hash = '#/catalog'; };
    document.querySelectorAll('[data-act]').forEach(el => el.innerHTML = actHtml(el.dataset.act));
  }catch(x){
    err.textContent='Не получилось отправить. Попробуйте ещё раз или позвоните менеджеру.'; go.disabled=false; go.textContent='Отправить заявку';
  }
}

/* ---------- views ---------- */
const catName = id => (DATA.cats.find(c=>c.id===id)||{}).name || '';
function card(p, opts={}){
  return `<article class="card"><a class="ph" href="#/p/${esc(p.id)}" aria-label="${esc(p.n+' '+p.m)}">${imgTag(p)}${tag(p)}</a>
  <div class="bd"><a class="nm" href="#/p/${esc(p.id)}">${esc(p.n)}</a><div class="mt">${esc(p.m)} · ${esc(p.b)}</div>
  <div class="box">Коробка ${p.k} шт: <b>${rub(boxSum(p))}</b></div>
  <div class="act" data-act="${esc(p.id)}">${actHtml(p.id)}</div></div></article>`;
}
function viewHome(){
  const pick = ['kd-2063','50233','60646','jmk-9021','kb-1106','km-1086'].map(id=>BY[id]).filter(Boolean);
  const cats = DATA.cats.map(c => { const L = DATA.items.filter(p=>p.c===c.id); const ph = L.find(p=>p.i&&p.i.startsWith('/img')) || L[0]; return {c, n:L.length, ph}; });
  const fresh = DATA.items.slice(0,8);
  return `
  <section class="hero"><div class="wrap grid">
    <div>
      <h1>Бытовая техника оптом из Китая</h1>
      <p class="lead">Официальный дистрибьютор DSP и JAMAKY. Прямые поставки, доставка по всей России, склад в Москве.</p>
      <div class="cta"><a class="btn tag" href="#/catalog">Открыть каталог</a><a class="btn ghost" href="#/contacts">Связаться с менеджером</a></div>
      <form class="heroq" id="heroQ" role="search"><input type="search" placeholder="Модель или название: KD-2063, фен, блендер" aria-label="Поиск по каталогу"><button type="submit">Найти</button></form>
    </div>
    <div class="wall" aria-label="Хиты каталога">${pick.map(p=>`<a href="#/p/${esc(p.id)}" aria-label="${esc(p.n+' '+p.m)}">${imgTag(p)}${tag(p)}</a>`).join('')}</div>
  </div></section>

  <section class="blk"><div class="wrap">
    <div class="shead"><h2>Разделы каталога</h2><a href="#/catalog">Весь каталог, ${DATA.items.length} ${plural(DATA.items.length,'модель','модели','моделей')}</a></div>
    <div class="cats">${cats.map(({c,n,ph})=>`<a class="cat" href="#/catalog?c=${c.id}">${ph?imgTag(ph):''}<div><b>${esc(c.name)}</b><span>${n} ${plural(n,'модель','модели','моделей')}</span></div></a>`).join('')}</div>
  </div></section>

  <section class="blk" style="padding-top:0"><div class="wrap">
    <div class="shead"><h2>Свежие поступления</h2><a href="#/catalog?s=new">Смотреть все новинки</a></div>
    <div class="rail">${fresh.map(card).join('')}</div>
  </div></section>

  <section class="blk" style="background:var(--white);border-block:1px solid var(--line)"><div class="wrap">
    <div class="shead"><h2>Как заказать</h2></div>
    <div class="steps">
      <div class="stp"><h3>Выберите технику</h3><p>Цена в каталоге указана за штуку, рядом — сколько штук в коробке и сколько стоит целая коробка.</p></div>
      <div class="stp"><h3>Оставьте заявку</h3><p>Добавьте коробки в корзину, укажите имя, телефон и город. Оплата на сайте не нужна.</p></div>
      <div class="stp"><h3>Менеджер свяжется с вами</h3><p>Подтвердит наличие, итоговую цену и доставку в ваш регион. Забрать можно и самовывозом из Москвы.</p></div>
    </div>
  </div></section>

  <section class="blk"><div class="wrap">
    <div class="shead"><h2>Бренды</h2></div>
    <div class="brands"><a href="#/catalog?b=DSP">DSP</a><a href="#/catalog?b=JAMAKY">JAMAKY</a><a href="#/catalog?b=LUVIMA">LUVIMA</a></div>
  </div></section>

  <section class="blk" style="padding-top:0"><div class="wrap">${contactBlock()}</div></section>`;
}
function contactBlock(){
  return `<div class="contact">
    <div class="addr"><h2>Приезжайте в павильон</h2>
      <div class="big">Москва, ТК «Южные ворота»<br>8 линия (Ж8), павильон 18-20</div>
      <p>Товары в ограниченном количестве, поэтому наличие лучше уточнить заранее.</p>
      <p><a class="btn tag sm" href="https://yandex.ru/maps/?text=${encodeURIComponent('ТК Южные ворота Москва')}" target="_blank" rel="noopener">Показать на карте</a></p></div>
    <div class="mgrs">${MANAGERS.map(m=>`<div class="mgr"><b>${m.name}<small>${m.phone}</small></b>
      <a class="btn sm" href="tel:+${m.wa}">Позвонить</a>
      <a class="btn ghost sm" href="https://wa.me/${m.wa}" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn ghost sm" href="https://t.me/${m.tg}" target="_blank" rel="noopener">Telegram</a></div>`).join('')}</div>
  </div>`;
}
function viewContacts(){ return `<div class="wrap"><div class="page-h"><h1 style="font-size:clamp(34px,6vw,56px)">Контакты</h1></div><section class="blk" style="padding-top:12px">${contactBlock()}</section></div>`; }
function viewOrder(){
  return `<div class="wrap"><div class="page-h"><h1 style="font-size:clamp(34px,6vw,56px)">Как заказать</h1></div><section class="blk" style="padding-top:12px">
  <div class="steps">
    <div class="stp"><h3>Выберите технику</h3><p>Цена указана за штуку. Заказывать нужно коробками: в карточке видно, сколько штук в коробке и сколько она стоит.</p></div>
    <div class="stp"><h3>Оставьте заявку</h3><p>Положите коробки в корзину и отправьте заявку. Можно и написать менеджеру напрямую в WhatsApp или Telegram.</p></div>
    <div class="stp"><h3>Получите технику</h3><p>Менеджер подтвердит наличие и итоговую сумму. Доставляем по всем регионам России, из Москвы можно забрать самовывозом.</p></div>
  </div>
  <p style="margin-top:22px"><a class="btn tag" href="#/catalog">Перейти в каталог</a></p></section></div>`;
}
let CAT = {c:'', b:'', q:'', s:'new', n:24};
function viewCatalog(params){
  CAT = {c:params.get('c')||'', b:params.get('b')||'', q:params.get('q')||'', s:params.get('s')||'new', n:24};
  const brands = [...new Set(DATA.items.map(p=>p.b))];
  return `<div class="wrap"><div class="page-h"><h1 style="font-size:clamp(34px,6vw,56px)">Каталог</h1></div>
  <div class="filters"><div class="chips" role="group" aria-label="Разделы">
    <button class="chip" data-c="" aria-pressed="${CAT.c===''}">Все</button>
    ${DATA.cats.map(c=>`<button class="chip" data-c="${c.id}" aria-pressed="${CAT.c===c.id}">${esc(c.name)}</button>`).join('')}</div>
    <div class="frow"><input id="fq" type="search" placeholder="Поиск по названию или модели" value="${esc(CAT.q)}" aria-label="Поиск">
    <select id="fb" aria-label="Бренд"><option value="">Все бренды</option>${brands.map(b=>`<option ${CAT.b===b?'selected':''}>${esc(b)}</option>`).join('')}</select>
    <select id="fs" aria-label="Сортировка"><option value="new" ${CAT.s==='new'?'selected':''}>Сначала новые</option><option value="asc" ${CAT.s==='asc'?'selected':''}>Сначала дешевле</option><option value="desc" ${CAT.s==='desc'?'selected':''}>Сначала дороже</option><option value="name" ${CAT.s==='name'?'selected':''}>По названию</option></select></div></div>
  <p class="count" id="cnt"></p><div class="grid4" id="grid"></div><div class="more" id="more"></div></div>`;
}
function filtered(){
  const q = CAT.q.trim().toLowerCase();
  let L = DATA.items.filter(p => (!CAT.c||p.c===CAT.c) && (!CAT.b||p.b===CAT.b) && (!q || (p.n+' '+p.m+' '+p.b).toLowerCase().includes(q)));
  if(CAT.s==='asc') L=[...L].sort((a,b)=>a.p-b.p); else if(CAT.s==='desc') L=[...L].sort((a,b)=>b.p-a.p); else if(CAT.s==='name') L=[...L].sort((a,b)=>a.n.localeCompare(b.n,'ru'));
  return L;
}
function paintCatalog(){
  const L = filtered(), shown = L.slice(0, CAT.n);
  $('#cnt').textContent = L.length ? `Найдено: ${L.length} ${plural(L.length,'модель','модели','моделей')}` : '';
  $('#grid').innerHTML = shown.length ? shown.map(card).join('') : `<div class="empty" style="grid-column:1/-1"><p><b>Ничего не нашли</b></p><p class="muted">Проверьте написание модели или сбросьте фильтры.</p><button class="btn" id="reset">Сбросить фильтры</button></div>`;
  $('#more').innerHTML = L.length > shown.length ? `<button class="btn ghost" id="moreBtn">Показать ещё (${L.length-shown.length})</button>` : '';
  const m=$('#moreBtn'); if(m) m.onclick=()=>{CAT.n+=24; paintCatalog();};
  const r=$('#reset'); if(r) r.onclick=()=>{ CAT={c:'',b:'',q:'',s:'new',n:24}; location.hash='#/catalog'; };
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.c===CAT.c)));
}
function bindCatalog(){
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{CAT.c=b.dataset.c;CAT.n=24;paintCatalog();});
  let t; $('#fq').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{CAT.q=e.target.value;CAT.n=24;paintCatalog();},180);};
  $('#fb').onchange=e=>{CAT.b=e.target.value;CAT.n=24;paintCatalog();};
  $('#fs').onchange=e=>{CAT.s=e.target.value;paintCatalog();};
  paintCatalog();
}
function viewProduct(id){
  const p = BY[id]; if(!p) return `<div class="wrap"><div class="empty" style="margin:30px 0"><p><b>Такого товара нет</b></p><a class="btn" href="#/catalog">В каталог</a></div></div>`;
  const rel = DATA.items.filter(x=>x.c===p.c && x.id!==p.id).slice(0,4);
  return `<div class="wrap"><div class="crumbs"><a href="#/catalog">Каталог</a> / <a href="#/catalog?c=${p.c}">${esc(catName(p.c))}</a></div>
  <div class="prod"><div class="pic">${imgTag(p).replace('loading="lazy"','')}</div>
  <div><h1>${esc(p.n)}</h1><p class="muted" style="margin:6px 0 16px">Модель ${esc(p.m)} · ${esc(p.b)}</p>${tag(p,true)}
    <table class="specs"><tr><td>Цена за штуку</td><td>${rub(p.p)}</td></tr><tr><td>В коробке</td><td>${p.k} шт</td></tr><tr><td>Цена за коробку</td><td>${rub(boxSum(p))}</td></tr><tr><td>Бренд</td><td>${esc(p.b)}</td></tr><tr><td>Раздел</td><td>${esc(catName(p.c))}</td></tr></table>
    <div class="buyrow"><div data-act="${esc(p.id)}" style="min-width:170px">${actHtml(p.id)}</div><button class="btn tag" id="buyNow">Оформить заявку</button></div>
    <p class="note">Цена за штуку, заказ коробками. Наличие и итоговую сумму подтверждает менеджер.</p></div></div>
  ${rel.length?`<section class="blk" style="padding-top:0"><div class="shead"><h2>Похожие товары</h2></div><div class="grid4">${rel.map(card).join('')}</div></section>`:''}</div>`;
}

/* ---------- router ---------- */
function route(){
  const raw = location.hash.replace(/^#/, '') || '/'; const [path, qs] = raw.split('?'); const params = new URLSearchParams(qs||'');
  const app = $('#app'); let nav='home', title='DSP-JAMAKY — бытовая техника оптом, Москва';
  if(!DATA.items.length){ app.innerHTML = '<div class="wrap" style="padding:60px 0"><p class="muted">Загружаем каталог…</p></div>'; return; }
  if(path.startsWith('/p/')){ const id=decodeURIComponent(path.slice(3)); app.innerHTML=viewProduct(id); nav='catalog'; if(BY[id]) title=BY[id].n+' '+BY[id].m+' — оптом'; const b=$('#buyNow'); if(b) b.onclick=()=>{ if(!cart[id]) setQty(id,1); openCart(); }; }
  else if(path==='/catalog'){ app.innerHTML=viewCatalog(params); nav='catalog'; title='Каталог — DSP-JAMAKY'; bindCatalog(); }
  else if(path==='/order'){ app.innerHTML=viewOrder(); nav='order'; title='Как заказать — DSP-JAMAKY'; }
  else if(path==='/contacts'){ app.innerHTML=viewContacts(); nav='contacts'; title='Контакты — DSP-JAMAKY'; }
  else { app.innerHTML=viewHome(); const f=$('#heroQ'); f.onsubmit=e=>{e.preventDefault(); const q=f.querySelector('input').value.trim(); location.hash='#/catalog'+(q?'?q='+encodeURIComponent(q):'');}; }
  document.title = title;
  document.querySelectorAll('nav.main a').forEach(a=>{ if(a.dataset.nav===nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
fetch('/products.json').then(r=>r.json()).then(d=>{ DATA=d; BY=Object.fromEntries(d.items.map(p=>[p.id,p])); Object.keys(cart).forEach(id=>{ if(!BY[id]) delete cart[id]; }); refresh(); route(); })
  .catch(()=>{ $('#app').innerHTML='<div class="wrap" style="padding:60px 0"><p><b>Не удалось загрузить каталог.</b> Обновите страницу.</p></div>'; });
route();
</script>
</body>
</html>
