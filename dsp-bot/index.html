<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F3F1">
<title>DSP-JAMAKY — бытовая техника оптом, Москва</title>
<meta name="description" content="Официальный дистрибьютор DSP и JAMAKY. Бытовая техника оптом из Китая, доставка по всей России. ТК «Южные ворота», 8 линия, павильон 18-20.">
<meta property="og:title" content="DSP-JAMAKY — бытовая техника оптом">
<meta property="og:image" content="/img/kd-2063.jpg">
<link rel="icon" href="/img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F2F3F1; --card:#fff; --stage:#F6F7F5; --ink:#141815; --ink2:#4D554F; --mute:#7C847E; --line:#E3E6E2;
  --brand:#1B2C23; --brand2:#26402F; --accent:#C9F25A; --accent-ink:#1B2C23; --ok:#1F7A45; --err:#B3261E;
  --r-lg:32px; --r-md:24px; --r-sm:16px;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --wrap:1240px; --gut:20px; --hdr:68px; --tab:0px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 var(--font);padding-bottom:var(--tab)}
img{display:block;max-width:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-inline:var(--gut)}
h1,h2,h3{margin:0;font-weight:800;letter-spacing:-.025em;line-height:1.08}
h1{font-size:clamp(34px,5.6vw,64px)}
h2{font-size:clamp(26px,3.6vw,40px)}
h3{font-size:20px}
p{margin:0}
.mute{color:var(--mute)}
.hide{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border:0;border-radius:999px;background:var(--brand);color:#fff;font-weight:700;text-decoration:none;white-space:nowrap;transition:background .15s,transform .1s}
.btn:hover{background:var(--brand2)}
.btn:active{transform:scale(.98)}
.btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.line:hover{background:var(--ink);color:#fff}
.btn.lime{background:var(--accent);color:var(--accent-ink)}
.btn.lime:hover{background:#d8f77f}
.btn.sm{min-height:40px;padding:0 18px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.pill-link{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;background:var(--card);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.pill-link:hover{background:var(--brand);color:#fff}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:rgba(242,243,241,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.hdr .row{display:flex;align-items:center;gap:18px;min-height:var(--hdr)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{height:44px;width:auto;border-radius:12px}
.brand b{font-weight:800;font-size:15px;line-height:1.15;letter-spacing:-.01em;display:none}
.brand b small{display:block;font-weight:600;font-size:12px;color:var(--mute);letter-spacing:0}
nav.main{display:none;gap:4px;margin-left:10px}
nav.main a{padding:9px 16px;border-radius:999px;text-decoration:none;font-weight:700;font-size:15px;color:var(--ink2)}
nav.main a:hover{background:var(--card)}
nav.main a[aria-current=page]{background:var(--card);color:var(--ink)}
.sp{flex:1}
.hphone{display:none;font-weight:800;text-decoration:none;font-size:15px}
.cartbtn{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 20px 0 16px;border:0;border-radius:999px;background:var(--brand);color:#fff;font-weight:700}
.cartbtn:hover{background:var(--brand2)}
.cartbtn svg{width:22px;height:22px}
.cartbtn .n{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:800;display:grid;place-items:center}
.cartbtn .n.zero{display:none}
@media(min-width:900px){nav.main{display:flex}.brand b{display:block}.hphone{display:block}}

/* hero */
.hero{padding-block:8px}
.hero-p{position:relative;isolation:isolate;background:var(--brand);color:#fff;border-radius:var(--r-lg);padding:clamp(22px,4vw,56px);display:grid;grid-template-columns:minmax(0,1fr);gap:26px;overflow:hidden}
.hero-p>*{min-width:0}
.hero-p::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(520px 320px at 92% 8%,rgba(201,242,90,.28),transparent 65%),radial-gradient(420px 280px at 0% 100%,rgba(201,242,90,.10),transparent 70%)}
.hero-p::after{content:"DSP";position:absolute;right:-2%;bottom:-9%;z-index:-1;font-weight:800;font-size:clamp(160px,30vw,380px);letter-spacing:-.06em;line-height:1;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.07)}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;background:rgba(255,255,255,.1);font-size:13px;font-weight:700;color:#E8F5C8}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(201,242,90,.25)}
.hero-p h1{margin-top:18px;font-size:clamp(36px,5.6vw,64px);line-height:1.03}
.hero-p h1 em{font-style:normal;color:var(--accent)}
.hero-p .lead{font-size:clamp(16px,1.6vw,19px);color:rgba(255,255,255,.74);max-width:500px;margin-top:18px}
.hero-p .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.hero-p .btn.line{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45)}
.hero-p .btn.line:hover{background:#fff;color:var(--brand)}
.heroq{display:flex;margin-top:22px;max-width:500px;background:rgba(255,255,255,.1);border-radius:999px;padding:5px;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16)}
.heroq input{flex:1;min-width:0;border:0;background:transparent;padding:0 18px;outline:0;font-weight:600;color:#fff}
.heroq input::placeholder{color:rgba(255,255,255,.55)}
.heroq button{border:0;border-radius:999px;min-height:44px;padding:0 22px;background:var(--accent);color:var(--accent-ink);font-weight:800}
.stack{position:relative;height:clamp(300px,82vw,330px);margin-top:6px}
.sc{position:absolute;display:block;background:#fff;border-radius:22px;padding:7px;box-shadow:0 18px 40px rgba(0,0,0,.28);text-decoration:none;color:var(--ink);transition:transform .25s}
.sc:hover{transform:rotate(0) scale(1.03)!important;z-index:5}
.sc .im{aspect-ratio:1;border-radius:16px;background:var(--stage);overflow:hidden}
.sc img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:5%}
.sc .st{position:absolute;left:-8px;bottom:-10px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:15px;padding:7px 13px;border-radius:14px;transform:rotate(-5deg);box-shadow:0 6px 14px rgba(0,0,0,.2);white-space:nowrap}
.st small{font-weight:700;opacity:.7;margin-left:4px;font-size:11px}
.sc.s1{left:0;top:26px;width:55%;transform:rotate(-5deg);z-index:2}
.sc.s2{right:0;top:0;width:45%;transform:rotate(5deg)}
.sc.s2 .st{left:auto;right:-6px;top:-10px;bottom:auto;transform:rotate(5deg)}
.sc.s3{right:6%;bottom:0;width:41%;transform:rotate(-2deg);z-index:3}
.pt{display:inline-block;padding:5px 11px;border-radius:999px;background:var(--card);box-shadow:0 1px 0 var(--line);font-weight:800;font-size:13px;white-space:nowrap}
.ticker{margin-top:10px;overflow:hidden;border-radius:999px;background:var(--accent);color:var(--accent-ink);padding:13px 0}
.ticker div{display:flex;width:max-content;animation:tick 32s linear infinite}
.ticker span{padding:0 22px;font-weight:800;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:44px}
.ticker span::after{content:"✦";font-size:13px;opacity:.7}
@keyframes tick{to{transform:translateX(-50%)}}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.facts div{background:var(--card);border-radius:var(--r-md);padding:20px 22px}
.facts div:first-child{background:#E4F3B9}
.facts b{display:block;font-size:clamp(24px,3vw,36px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.facts span{display:block;margin-top:4px;font-size:14px;color:var(--ink2);font-weight:600}
@media(min-width:900px){.hero-p{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:center;min-height:540px}.stack{height:440px}.facts{grid-template-columns:repeat(4,minmax(0,1fr))}.sc .st{font-size:18px}}

/* sections */
.sec{padding-block:clamp(36px,5vw,64px) 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.sec-h p{color:var(--mute);margin-top:8px}
.cat-g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.cat{position:relative;display:block;text-decoration:none;border-radius:var(--r-md);background:var(--t,var(--card));padding:14px;min-width:0;overflow:hidden;transition:transform .18s}
.cat:hover{transform:translateY(-3px)}
.cat .im{aspect-ratio:4/3;border-radius:18px;background:rgba(255,255,255,.7);overflow:hidden}
.cat .im img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:6%}
.cat h3{font-size:17px;margin:14px 4px 0;overflow-wrap:break-word}
.cat p{color:var(--mute);font-size:14px;font-weight:600;margin:3px 4px 4px}
@media(min-width:760px){.cat-g{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.cat-g{grid-template-columns:repeat(6,1fr)}.cat h3{font-size:16px}}

/* product grid + card */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1100px){.grid.c4{grid-template-columns:repeat(4,1fr)}}
.pc{background:var(--card);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;min-width:0}
.stage{position:relative;display:block;aspect-ratio:1;border-radius:18px;background:var(--stage);overflow:hidden}
.stage img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;padding:7%;transition:transform .25s}
.pc:hover .stage img{transform:scale(1.04)}
.tag{position:absolute;left:8px;top:8px;padding:4px 10px;border-radius:999px;background:var(--card);font-size:11px;font-weight:800;letter-spacing:.02em}
.pc .bd{padding:12px 6px 4px;display:flex;flex-direction:column;flex:1}
.pc .nm{font-weight:700;font-size:15px;line-height:1.28;text-decoration:none;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.56em}
.pc .md{font-size:13px;color:var(--mute);font-weight:600;margin-top:3px}
.pc .price{margin-top:10px;font-size:20px;font-weight:800;letter-spacing:-.02em}
.pc .price small{font-size:12px;color:var(--mute);font-weight:600;margin-left:3px;letter-spacing:0}
.pc .box{font-size:13px;color:var(--ink2);font-weight:600;margin-top:2px}
.pc .act{margin-top:auto;padding-top:12px}
.add{width:100%;min-height:44px;border:0;border-radius:999px;background:var(--stage);font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,color .15s}
.add:hover{background:var(--brand);color:#fff}
.add i{font-style:normal;font-size:20px;line-height:1;font-weight:600}
.step{display:flex;align-items:center;justify-content:space-between;min-height:44px;border-radius:999px;background:var(--brand);color:#fff;padding:4px}
.step button{width:36px;height:36px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:20px;line-height:1;font-weight:600}
.step button:hover{background:var(--accent);color:var(--accent-ink)}
.step span{font-weight:800;font-size:15px}
.step small{font-weight:600;opacity:.7;margin-left:4px;font-size:12px}

@media(max-width:759px){.rail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:calc(var(--gut) * -1);padding:0 var(--gut) 8px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.rail .pc{flex:0 0 66%;scroll-snap-align:start}}
/* feature cards */
.f-g{display:grid;gap:12px}
.feat{background:var(--card);border-radius:var(--r-md);padding:26px}
.feat .ic{width:48px;height:48px;border-radius:16px;background:var(--accent);display:grid;place-items:center;margin-bottom:18px}
.feat .ic svg{width:24px;height:24px;stroke:var(--accent-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.feat p{color:var(--ink2);margin-top:8px;font-size:15px}
@media(min-width:760px){.f-g{grid-template-columns:repeat(3,1fr)}}
.steps{display:grid;gap:12px;counter-reset:s}
.stp{background:var(--card);border-radius:var(--r-md);padding:26px;counter-increment:s}
.stp::before{content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;font-weight:800;margin-bottom:16px}
.stp p{color:var(--ink2);margin-top:8px;font-size:15px}
@media(min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
.brands{display:flex;flex-wrap:wrap;gap:10px}
.brands a{padding:16px 30px;border-radius:var(--r-sm);background:var(--card);font-weight:800;font-size:20px;letter-spacing:-.01em;text-decoration:none}
.brands a:hover{background:var(--brand);color:#fff}

/* contacts */
.ct-g{display:grid;gap:12px}
.addr{background:var(--brand);color:#fff;border-radius:var(--r-lg);padding:clamp(24px,4vw,44px)}
.addr .big{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin:18px 0 12px}
.addr p{color:rgba(255,255,255,.72);font-size:15px;max-width:420px}
.addr .btn{margin-top:22px}
.mgrs{display:grid;gap:10px;align-content:start}
.mgr{background:var(--card);border-radius:var(--r-md);padding:18px 20px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.mgr b{flex:1 1 160px;font-size:18px;font-weight:800}
.mgr b small{display:block;font-size:14px;color:var(--mute);font-weight:600}
.mgr .ac{display:flex;flex-wrap:wrap;gap:8px}
@media(min-width:900px){.ct-g{grid-template-columns:1fr 1fr}}

/* faq */
.faq{display:grid;gap:8px;max-width:860px}
.faq details{background:var(--card);border-radius:var(--r-md);padding:0 24px}
.faq summary{list-style:none;cursor:pointer;padding:20px 0;font-weight:700;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:26px;font-weight:500;color:var(--mute);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{padding:0 0 22px;color:var(--ink2);max-width:680px}

/* band */
.band{background:var(--brand);color:#fff;border-radius:var(--r-lg);padding:clamp(28px,5vw,56px);display:grid;gap:24px;align-items:center}
.band p{color:rgba(255,255,255,.72);margin-top:10px}
.band .acts{display:flex;flex-wrap:wrap;gap:10px}
.band .btn.line{color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5)}
.band .btn.line:hover{background:#fff;color:var(--brand)}
@media(min-width:900px){.band{grid-template-columns:1.3fr 1fr}.band .acts{justify-content:flex-end}}

footer{margin-top:clamp(36px,5vw,64px);padding-block:28px 40px;color:var(--mute);font-size:14px;font-weight:600}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px}
footer a{color:var(--ink2)}

/* page head / catalog */
.page-h{padding-block:28px 20px}
.page-h h1{font-size:clamp(32px,5vw,52px)}
.crumbs{padding-block:20px 6px;font-size:14px;color:var(--mute);font-weight:600}
.crumbs a{text-decoration:none}
.crumbs a:hover{color:var(--ink)}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:11px 20px;border-radius:999px;border:0;background:var(--card);font-weight:700;font-size:15px}
.tab[aria-pressed=true]{background:var(--brand);color:#fff}
.cat-l{display:grid;gap:16px;margin-top:16px}
.side{background:var(--card);border-radius:var(--r-md);padding:20px;align-self:start}
.side h4{margin:0 0 10px;font-size:13px;color:var(--mute);font-weight:700}
.side .g{margin-bottom:20px}
.side .g:last-child{margin-bottom:0}
.inp{width:100%;min-height:46px;padding:0 18px;border:1.5px solid var(--line);border-radius:999px;background:var(--stage);outline:0;font-weight:600}
.inp:focus{border-color:var(--brand);background:#fff}
.opt{display:flex;flex-wrap:wrap;gap:6px}
.opt button{padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px}
.opt button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.fbtn{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 20px;border:0;border-radius:999px;background:var(--card);font-weight:700}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.toolbar .cnt{color:var(--mute);font-weight:600;font-size:15px}
.more{display:flex;justify-content:center;margin-top:26px}
.empty{background:var(--card);border-radius:var(--r-md);padding:44px 24px;text-align:center;display:grid;gap:10px;justify-items:center}
@media(min-width:900px){.cat-l{grid-template-columns:270px 1fr;gap:20px}.side{position:sticky;top:calc(var(--hdr) + 12px)}.fbtn,.side .sx{display:none}}
@media(max-width:899px){
  .side{position:fixed;left:0;right:0;bottom:0;z-index:50;border-radius:28px 28px 0 0;max-height:82vh;overflow:auto;transform:translateY(105%);transition:transform .28s;padding-bottom:calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.18)}
  .side.on{transform:none}
  .side .sx{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .side .sx b{font-size:20px;font-weight:800}
  .side .sx button{border:0;background:var(--stage);width:38px;height:38px;border-radius:50%;font-size:22px}
}

/* product page */
.prod{display:grid;gap:12px;margin-top:8px}
.pic{background:var(--card);border-radius:var(--r-lg);padding:14px}
.pic .stage{aspect-ratio:1;border-radius:22px}
.pic .stage img{padding:8%}
.pp{background:var(--card);border-radius:var(--r-lg);padding:clamp(22px,3vw,36px)}
.pp h1{font-size:clamp(26px,3.4vw,38px)}
.pp .sub{color:var(--mute);margin-top:8px;font-weight:600}
.pp .big{margin-top:22px;font-size:clamp(34px,4vw,46px);font-weight:800;letter-spacing:-.03em}
.pp .big small{font-size:15px;color:var(--mute);font-weight:600;letter-spacing:0;margin-left:6px}
.boxrow{margin-top:14px;padding:16px 18px;border-radius:var(--r-sm);background:var(--stage);display:flex;justify-content:space-between;gap:10px;font-weight:700;flex-wrap:wrap}
.boxrow span{color:var(--ink2);font-weight:600}
.specs{width:100%;border-collapse:collapse;margin-top:18px;font-size:15px}
.specs td{padding:11px 0;border-top:1px solid var(--line)}
.specs td:last-child{text-align:right;font-weight:700}
.buyrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;align-items:center}
.buyrow .a{flex:1 1 170px;min-width:170px}
.note{margin-top:14px;font-size:13px;color:var(--mute);font-weight:600}
@media(min-width:900px){.prod{grid-template-columns:1fr 1fr;align-items:start}.pic{position:sticky;top:calc(var(--hdr) + 12px)}}

/* cart drawer / sheet */
.ovl{position:fixed;inset:0;background:rgba(20,24,21,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.ovl.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:60;background:var(--bg);display:flex;flex-direction:column;transition:transform .28s;right:0;top:0;bottom:0;width:min(440px,100%);transform:translateX(105%)}
.drawer.on{transform:none}
.drawer .hd{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px}
.drawer .hd h3{font-size:24px}
.x{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);font-size:22px;line-height:1}
.drawer .bdy{flex:1;overflow:auto;padding:4px 20px 12px;display:grid;gap:8px;align-content:start}
.li{display:grid;grid-template-columns:76px 1fr;gap:12px;background:var(--card);border-radius:var(--r-sm);padding:10px}
.li img{width:76px;height:76px;object-fit:contain;mix-blend-mode:multiply;background:var(--stage);border-radius:12px;padding:4px}
.li .nm{font-weight:700;font-size:14px;line-height:1.3}
.li .r{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.li .step{min-height:36px;padding:3px}
.li .step button{width:30px;height:30px;font-size:17px}
.li .sum{font-weight:800}
.li .rm{border:0;background:none;color:var(--mute);text-decoration:underline;padding:0;font-size:12px;margin-top:4px}
.drawer .ft{padding:16px 20px calc(16px + env(safe-area-inset-bottom));background:var(--card);border-radius:28px 28px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.06)}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.tot b{font-size:26px;font-weight:800;letter-spacing:-.02em}
.fld{display:block;margin-bottom:8px}
.fld span{display:block;font-size:12px;color:var(--mute);margin:0 0 3px 14px;font-weight:700}
.fld input,.fld textarea{width:100%;min-height:46px;padding:10px 18px;border:1.5px solid var(--line);background:var(--stage);border-radius:22px;outline:0;resize:none}
.fld input:focus,.fld textarea:focus{border-color:var(--brand);background:#fff}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.err{color:var(--err);font-size:14px;font-weight:600;margin:4px 0;min-height:1.2em}
.drawer .empty,.drawer .done{background:transparent;padding:40px 8px}
@media(max-width:700px){
  .drawer{right:0;left:0;top:auto;bottom:0;width:100%;max-height:92vh;border-radius:28px 28px 0 0;transform:translateY(105%)}
}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--tab));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;z-index:70;border-radius:999px;font-weight:700;font-size:14px;max-width:90%}

/* Telegram mini-app mode */
.tabbar{display:none}
html[data-tg]{--tab:calc(64px + env(safe-area-inset-bottom));--hdr:56px}
html[data-tg] nav.main,html[data-tg] .hphone,html[data-tg] footer,html[data-tg] .cartbtn{display:none}
html[data-tg] .brand b{display:block}
html[data-tg] .brand img{height:36px}
html[data-tg] .hdr{position:static;background:transparent;backdrop-filter:none}
html[data-tg] .hdr .row{min-height:52px;padding-top:2px}
.tgcall{display:none}
html[data-tg] .tgcall{display:inline-flex}
html[data-tg] .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;text-decoration:none;font-size:11px;font-weight:700;color:var(--mute);padding:6px 0;position:relative}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar [aria-current=page]{color:var(--brand)}
.tabbar .bdg{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--brand);color:#fff;font-size:11px;display:grid;place-items:center}
.tabbar .bdg.zero{display:none}
html[data-tg] .drawer{max-height:88vh}
</style>

  <a href="#/contacts" data-nav="contacts"><svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 0 0-14 0c0 5.4 7 11 7 11zM12 10m-2.5 0a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0"/></svg>Контакты</a>
</nav>

<div class="ovl" id="ovl"></div>
<aside class="drawer" id="drawer" aria-label="Корзина" aria-hidden="true"></aside>
<div class="toast hide" id="toast" role="status"></div>

<script>
const TG = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
const tg = TG && TG.initData ? TG : null;
if (tg || /[?&]tg\b/.test(location.search)) {
  document.documentElement.dataset.tg = '1';
  try { if (tg) { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); tg.setHeaderColor('#F2F3F1'); tg.setBackgroundColor('#F2F3F1'); } } catch(e){}
}

const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const plural = (n,a,b,c) => { n=Math.abs(n)%100; const m=n%10; return (n>10&&n<20)?c:m>1&&m<5?b:m==1?a:c; };

const MANAGERS = [
  {name:'Ислам', phone:'+7 925 451-06-00', wa:'79254510600', tg:'IslamDsp'},
  {name:'Рахим', phone:'+7 925 381-57-55', wa:'79253815755', tg:'mnvrkk'},
  {name:'Алим',  phone:'+7 925 257-66-26', wa:'79252576626', tg:'Alimdsp'},
];
const FAQ = [
  ['Можно ли купить одну штуку?','Мы работаем оптом: заказ делается коробками. В карточке товара видно, сколько штук в коробке и сколько она стоит.'],
  ['Как узнать наличие и итоговую цену?','Отправьте заявку на сайте или напишите менеджеру в WhatsApp или Telegram. Он подтвердит наличие, цену и срок.'],
  ['Доставляете в регионы?','Да, отправляем по всей России транспортными компаниями. Стоимость доставки менеджер посчитает под ваш город. Можно забрать самому из Москвы.'],
  ['Нужно ли платить на сайте?','Нет. Сайт принимает заявку, оплата и документы согласуются с менеджером.'],
  ['Где вас найти?','Москва, ТК «Южные ворота», 8 линия (Ж8), павильон 18-20. Лучше предупредить заранее, чтобы нужный товар был собран.'],
];

let DATA = {cats:[], items:[]}, BY = {};
let cart = {};
try { cart = JSON.parse(localStorage.getItem('dsp_cart') || '{}'); } catch(e){}
const saveCart = () => { try { localStorage.setItem('dsp_cart', JSON.stringify(cart)); } catch(e){} };

const NOIMG = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#F6F7F5"/><g fill="none" stroke="#B9BFBA" stroke-width="5" stroke-linejoin="round"><path d="M50 70l50-24 50 24v62l-50 24-50-24z"/><path d="M50 70l50 24 50-24M100 94v62"/></g></svg>');
const imgTag = (p, lazy=true) => `<img src="${esc(p.i||NOIMG)}" alt="${esc(p.n+' '+p.m)}" ${lazy?'loading="lazy"':''} decoding="async" referrerpolicy="no-referrer" onerror="this.onerror=null;this.src='${NOIMG}'">`;
const boxSum = p => p.p * p.k;
const catName = id => (DATA.cats.find(c=>c.id===id)||{}).name || '';

/* ---------- cart ---------- */
const cartList = () => Object.entries(cart).filter(([id,q]) => q>0 && BY[id]).map(([id,q]) => ({p:BY[id], q}));
const cartTotals = () => cartList().reduce((a,{p,q}) => (a.boxes+=q, a.pcs+=q*p.k, a.sum+=q*boxSum(p), a), {boxes:0,pcs:0,sum:0});
function setQty(id, q){ q=Math.max(0,Math.min(9999,q|0)); if(q) cart[id]=q; else delete cart[id]; saveCart(); refresh(); }
function refresh(){
  const t = cartTotals();
  [['#cartN'],['#tabN']].forEach(([s]) => { const n=$(s); n.textContent=t.boxes; n.classList.toggle('zero', !t.boxes); });
  document.querySelectorAll('[data-act]').forEach(el => el.innerHTML = actHtml(el.dataset.act));
  if ($('#drawer').classList.contains('on')) renderDrawer(true);
}
function actHtml(id){
  const q = cart[id]||0;
  if(!q) return `<button class="add" data-add="${esc(id)}"><i>+</i>В корзину</button>`;
  return `<div class="step"><button data-dec="${esc(id)}" aria-label="Меньше">−</button><span>${q}<small>${plural(q,'коробка','коробки','коробок')}</small></span><button data-inc="${esc(id)}" aria-label="Больше">+</button></div>`;
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.add) { setQty(b.dataset.add, 1); toast('Добавлено в корзину'); }
  else if(b.dataset.inc) setQty(b.dataset.inc, (cart[b.dataset.inc]||0)+1);
  else if(b.dataset.dec) setQty(b.dataset.dec, (cart[b.dataset.dec]||0)-1);
  else if(b.dataset.rm) setQty(b.dataset.rm, 0);
});
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.remove('hide'); clearTimeout(tt); tt=setTimeout(()=>t.classList.add('hide'),1600); }

/* ---------- drawer ---------- */
let lastFocus=null;
function openCart(){ lastFocus=document.activeElement; renderDrawer(); $('#ovl').classList.add('on'); const d=$('#drawer'); d.classList.add('on'); d.setAttribute('aria-hidden','false'); const f=d.querySelector('button,input'); f&&f.focus(); }
function closeCart(){ $('#ovl').classList.remove('on'); const d=$('#drawer'); d.classList.remove('on'); d.setAttribute('aria-hidden','true'); closeSide(); lastFocus&&lastFocus.focus&&lastFocus.focus(); }
$('#cartOpen').onclick = openCart; $('#tabCart').onclick = openCart; $('#ovl').onclick = closeCart;
document.addEventListener('keydown', e => { if(e.key==='Escape') closeCart(); });
function renderDrawer(keepForm){
  const d = $('#drawer'), L = cartList(), t = cartTotals();
  let keep = {};
  if(keepForm){ ['name','phone','comment'].forEach(k => { const el=d.querySelector('[name='+k+']'); if(el) keep[k]=el.value; }); }
  if(!L.length){
    d.innerHTML = `<div class="hd"><h3>Корзина</h3><button class="x" aria-label="Закрыть" id="dx">×</button></div>
    <div class="bdy"><div class="empty"><h3>В корзине пусто</h3><p class="mute">Выберите технику в каталоге и добавьте её коробками.</p><a class="btn" href="#/catalog" id="toCat">Открыть каталог</a></div></div>`;
    $('#dx').onclick = closeCart; $('#toCat').onclick = closeCart; return;
  }
  d.innerHTML = `<div class="hd"><h3>Корзина</h3><button class="x" aria-label="Закрыть" id="dx">×</button></div>
  <div class="bdy">${L.map(({p,q}) => `<div class="li">${imgTag(p)}<div><div class="nm">${esc(p.n)} <span class="mute">${esc(p.m)}</span></div>
    <div class="mute" style="font-size:12px;font-weight:600">${p.k} шт в коробке × ${rub(p.p)}</div>
    <div class="r"><div class="step"><button data-dec="${esc(p.id)}" aria-label="Меньше">−</button><span>${q}</span><button data-inc="${esc(p.id)}" aria-label="Больше">+</button></div><span class="sum">${rub(q*boxSum(p))}</span></div>
    <button class="rm" data-rm="${esc(p.id)}">Убрать</button></div></div>`).join('')}</div>
  <form class="ft" id="ordForm" novalidate>
    <div class="tot"><span class="mute">${t.boxes} ${plural(t.boxes,'коробка','коробки','коробок')} · ${t.pcs} шт</span><b>${rub(t.sum)}</b></div>
    <label class="fld"><span>Имя</span><input name="name" autocomplete="name" required></label>
    <label class="fld"><span>Телефон</span><input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7" required></label>
    <label class="fld"><span>Город доставки или комментарий</span><textarea name="comment" rows="2"></textarea></label>
    <div class="hp" aria-hidden="true"><input name="website" tabindex="-1" autocomplete="off"></div>
    <div class="err" id="ordErr" role="alert"></div>
    <button class="btn lime" style="width:100%" id="ordGo" type="submit">Отправить заявку</button>
    <p class="note" style="text-align:center">Это заявка, не оплата. Менеджер подтвердит наличие, цену и доставку.</p>
  </form>`;
  $('#dx').onclick = closeCart;
  Object.entries(keep).forEach(([k,v]) => { d.querySelector('[name='+k+']').value = v; });
  $('#ordForm').onsubmit = submitOrder;
}
async function submitOrder(e){
  e.preventDefault();
  const f = e.target, name=f.name.value.trim(), phone=f.phone.value.trim(), err=$('#ordErr');
  if(!name) { err.textContent='Укажите имя'; f.name.focus(); return; }
  if(phone.replace(/\D/g,'').length < 10) { err.textContent='Укажите телефон, например +7 900 123-45-67'; f.phone.focus(); return; }
  err.textContent=''; const go=$('#ordGo'); go.disabled=true; go.textContent='Отправляем…';
  const items = cartList().map(({p,q}) => ({id:p.id, qty:q}));
  try{
    const r = await fetch('/api/order', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({initData: tg ? tg.initData : '', name, phone, comment: f.comment.value.trim(), website: f.website.value, items})});
    if(!r.ok) throw new Error(r.status);
    const t = cartTotals(); cart = {}; saveCart();
    $('#drawer').innerHTML = `<div class="hd"><h3>Заявка отправлена</h3><button class="x" aria-label="Закрыть" id="dx">×</button></div>
      <div class="bdy"><div class="done" style="text-align:center"><h3 style="font-size:34px">${rub(t.sum)}</h3><h3 style="margin-top:12px">Спасибо, ${esc(name)}!</h3><p class="mute" style="margin:10px 0 20px">Менеджер свяжется с вами по номеру ${esc(phone)}, подтвердит наличие и расскажет про доставку.</p><button class="btn" id="dd">Вернуться в каталог</button></div></div>`;
    $('#dx').onclick = closeCart; $('#dd').onclick = () => { closeCart(); location.hash = '#/catalog'; };
    refresh();
  }catch(x){
    err.textContent='Не получилось отправить. Попробуйте ещё раз или позвоните менеджеру.'; go.disabled=false; go.textContent='Отправить заявку';
  }
}

/* ---------- views ---------- */
function card(p){
  return `<article class="pc"><a class="stage" href="#/p/${esc(p.id)}" aria-label="${esc(p.n+' '+p.m)}">${imgTag(p)}<span class="tag">${esc(p.b)}</span></a>
  <div class="bd"><a class="nm" href="#/p/${esc(p.id)}">${esc(p.n)}</a><div class="md">${esc(p.m)}</div>
  <div class="price">${rub(p.p)}<small>за шт</small></div>
  <div class="box">Коробка ${p.k} шт: ${rub(boxSum(p))}</div>
  <div class="act" data-act="${esc(p.id)}">${actHtml(p.id)}</div></div></article>`;
}
const ICONS = {
  truck:'<path d="M3 6h11v10H3zM14 9h4l3 3v4h-7zM7 19a2 2 0 1 0 0-.01M17 19a2 2 0 1 0 0-.01"/>',
  box:'<path d="M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8"/>',
  tag:'<path d="M3 12V4h8l10 10-8 8zM7.5 8.5h.01"/>',
};
const feat = (ic,t,p) => `<div class="feat"><div class="ic"><svg viewBox="0 0 24 24">${ICONS[ic]}</svg></div><h3>${t}</h3><p>${p}</p></div>`;
const TINTS=['#FFEFD9','#E3EEFF','#E6F5DC','#FCE5EA','#EBE5FA','#DFF2EF'];
function viewHome(){
  const pick = ['kd-2063','50233','60646'].map(id=>BY[id]).filter(Boolean);
  const cats = DATA.cats.map(c => { const L = DATA.items.filter(p=>p.c===c.id); const ph = L.find(p=>p.i&&p.i.startsWith('/img')) || L[0]; return {c, n:L.length, ph}; });
  const fresh = DATA.items.slice(0,8);
  const tk = ['DSP','JAMAKY','LUVIMA',DATA.items.length+' моделей','доставка по России','цены дистрибьютора','склад в Москве'];
  const tkHtml = '<span>'+tk.join('</span><span>')+'</span>';
  return `
  <section class="hero"><div class="wrap">
    <div class="hero-p">
      <div>
        <span class="badge"><i></i>Официальный дистрибьютор DSP и JAMAKY</span>
        <h1>Техника для дома <em>оптом</em> со склада в Москве</h1>
        <p class="lead">Кофеварки, блендеры, гриль, фены и утюги. Цены дистрибьютора, отгрузка коробками, доставка по всей России.</p>
        <div class="cta"><a class="btn lime" href="#/catalog">Открыть каталог</a><a class="btn line" href="#/contacts">Написать менеджеру</a></div>
        <form class="heroq" id="heroQ" role="search"><input type="search" placeholder="Модель или название: KD-2063, фен" aria-label="Поиск по каталогу"><button type="submit">Найти</button></form>
      </div>
      <div class="stack" aria-label="Хиты каталога">${pick.map((p,i)=>`<a class="sc s${i+1}" href="#/p/${esc(p.id)}" aria-label="${esc(p.n+' '+p.m)}"><div class="im">${imgTag(p,false)}</div><span class="st">${rub(p.p)}<small>за шт</small></span></a>`).join('')}</div>
    </div>
    <div class="ticker" aria-hidden="true"><div>${tkHtml}${tkHtml}${tkHtml}${tkHtml}</div></div>
    <div class="facts">
      <div><b>${DATA.items.length}</b><span>моделей в каталоге</span></div>
      <div><b>от 250 ₽</b><span>цена за штуку</span></div>
      <div><b>вся Россия</b><span>доставка транспортными</span></div>
      <div><b>Москва</b><span>ТК «Южные ворота», пав. 18-20</span></div>
    </div>
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="sec-h"><h2>Что ищете</h2><a class="pill-link" href="#/catalog">Весь каталог →</a></div>
    <div class="cat-g">${cats.map(({c,n,ph},i)=>`<a class="cat" style="--t:${TINTS[i%6]}" href="#/catalog?c=${c.id}"><div class="im">${ph?imgTag(ph):''}</div><h3>${esc(c.name)}</h3><p>${n} ${plural(n,'модель','модели','моделей')}</p></a>`).join('')}</div>
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="sec-h"><div><h2>Свежие поступления</h2><p>Количество ограничено, популярное разбирают быстро.</p></div><a class="pill-link" href="#/catalog?s=new">Все новинки →</a></div>
    <div class="grid c4 rail">${fresh.map(card).join('')}</div>
    <div class="more"><a class="btn line" href="#/catalog">Показать весь каталог</a></div>
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="sec-h"><div><h2>Почему с нами удобно</h2></div></div>
    <div class="f-g">
      ${feat('tag','Цены дистрибьютора','Прямые поставки без лишних посредников. Цена указана за штуку, рядом сразу видна цена коробки.')}
      ${feat('box','Склад в Москве','Основной ассортимент в наличии. Можно приехать, посмотреть и забрать самовывозом.')}
      ${feat('truck','Доставка по России','Отправляем транспортными компаниями в любой регион. Стоимость посчитаем под ваш город.')}
    </div>
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="sec-h"><h2>Как заказать</h2></div>
    ${stepsHtml()}
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="sec-h"><h2>Бренды</h2></div>
    <div class="brands"><a href="#/catalog?b=DSP">DSP</a><a href="#/catalog?b=JAMAKY">JAMAKY</a><a href="#/catalog?b=LUVIMA">LUVIMA</a></div>
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="sec-h"><h2>Приезжайте в павильон</h2></div>
    ${contactBlock()}
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="sec-h"><h2>Частые вопросы</h2></div>
    <div class="faq">${FAQ.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>
  </div></section>

  <section class="sec"><div class="wrap">
    <div class="band"><div><h2>Не нашли нужное? Подберём под ваш бюджет</h2><p>Напишите менеджеру, что нужно. Ответим и подскажем наличие.</p></div>
    <div class="acts"><a class="btn lime" href="https://t.me/${MANAGERS[0].tg}" target="_blank" rel="noopener">Написать в Telegram</a><a class="btn line" href="tel:+${MANAGERS[0].wa}">${MANAGERS[0].phone}</a></div></div>
  </div></section>`;
}
function stepsHtml(){
  return `<div class="steps">
    <div class="stp"><h3>Выберите технику</h3><p>Цена указана за штуку. Заказывать нужно коробками: в карточке видно, сколько штук в коробке и сколько она стоит.</p></div>
    <div class="stp"><h3>Оставьте заявку</h3><p>Положите коробки в корзину, укажите имя, телефон и город. Оплата на сайте не нужна.</p></div>
    <div class="stp"><h3>Получите технику</h3><p>Менеджер подтвердит наличие и итоговую сумму. Доставляем по России, из Москвы можно забрать самовывозом.</p></div>
  </div>`;
}
function contactBlock(){
  return `<div class="ct-g">
    <div class="addr"><h3 style="color:rgba(255,255,255,.7);font-size:15px;font-weight:700">Адрес</h3>
      <div class="big">Москва, ТК «Южные ворота»<br>8 линия (Ж8), павильон 18-20</div>
      <p>Товары в ограниченном количестве, поэтому наличие лучше уточнить заранее.</p>
      <a class="btn lime" href="https://yandex.ru/maps/?text=${encodeURIComponent('ТК Южные ворота Москва')}" target="_blank" rel="noopener">Показать на карте</a></div>
    <div class="mgrs">${MANAGERS.map(m=>`<div class="mgr"><b>${m.name}<small>${m.phone}</small></b>
      <div class="ac"><a class="btn sm" href="tel:+${m.wa}">Позвонить</a>
      <a class="btn line sm" href="https://wa.me/${m.wa}" target="_blank" rel="noopener">WhatsApp</a>
      <a class="btn line sm" href="https://t.me/${m.tg}" target="_blank" rel="noopener">Telegram</a></div></div>`).join('')}</div>
  </div>`;
}
const pageHead = t => `<div class="page-h"><h1>${t}</h1></div>`;
function viewContacts(){ return `<div class="wrap">${pageHead('Контакты')}${contactBlock()}</div>`; }
function viewOrder(){
  return `<div class="wrap">${pageHead('Как заказать')}${stepsHtml()}
  <div class="more" style="justify-content:flex-start"><a class="btn" href="#/catalog">Перейти в каталог</a></div>
  <div class="sec"><div class="sec-h"><h2>Частые вопросы</h2></div><div class="faq">${FAQ.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div></div></div>`;
}

let CAT = {c:'', b:'', q:'', s:'new', n:24};
function viewCatalog(params){
  CAT = {c:params.get('c')||'', b:params.get('b')||'', q:params.get('q')||'', s:params.get('s')||'new', n:24};
  const brands = [...new Set(DATA.items.map(p=>p.b))];
  const sorts = [['new','Новые'],['asc','Дешевле'],['desc','Дороже'],['name','По названию']];
  return `<div class="wrap">${pageHead('Каталог')}
  <div class="cat-tabs" role="group" aria-label="Разделы">
    <button class="tab" data-c="" aria-pressed="${CAT.c===''}">Все</button>
    ${DATA.cats.map(c=>`<button class="tab" data-c="${c.id}" aria-pressed="${CAT.c===c.id}">${esc(c.name)}</button>`).join('')}</div>
  <div class="cat-l">
    <aside class="side" id="side" aria-label="Фильтры">
      <div class="sx"><b>Фильтры</b><button type="button" id="sideX" aria-label="Закрыть">×</button></div>
      <div class="g"><h4>Поиск</h4><input class="inp" id="fq" type="search" placeholder="Название или модель" value="${esc(CAT.q)}" aria-label="Поиск"></div>
      <div class="g"><h4>Бренд</h4><div class="opt" id="fb"><button data-b="" aria-pressed="${CAT.b===''}">Все</button>${brands.map(b=>`<button data-b="${esc(b)}" aria-pressed="${CAT.b===b}">${esc(b)}</button>`).join('')}</div></div>
      <div class="g"><h4>Сортировка</h4><div class="opt" id="fs">${sorts.map(([v,l])=>`<button data-s="${v}" aria-pressed="${CAT.s===v}">${l}</button>`).join('')}</div></div>
      <button class="btn sx" style="width:100%" type="button" id="sideOk">Показать</button>
    </aside>
    <div>
      <div class="toolbar"><span class="cnt" id="cnt"></span><button class="fbtn" id="fOpen" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M6 15v4"/></svg>Фильтры</button></div>
      <div class="grid c3" id="grid"></div><div class="more" id="more"></div>
    </div>
  </div></div>`;
}
function closeSide(){ const s=$('#side'); if(s){ s.classList.remove('on'); } if(!$('#drawer').classList.contains('on')) $('#ovl').classList.remove('on'); }
function filtered(){
  const q = CAT.q.trim().toLowerCase();
  let L = DATA.items.filter(p => (!CAT.c||p.c===CAT.c) && (!CAT.b||p.b===CAT.b) && (!q || (p.n+' '+p.m+' '+p.b).toLowerCase().includes(q)));
  if(CAT.s==='asc') L=[...L].sort((a,b)=>a.p-b.p); else if(CAT.s==='desc') L=[...L].sort((a,b)=>b.p-a.p); else if(CAT.s==='name') L=[...L].sort((a,b)=>a.n.localeCompare(b.n,'ru'));
  return L;
}
function paintCatalog(){
  const L = filtered(), shown = L.slice(0, CAT.n);
  $('#cnt').textContent = `${L.length} ${plural(L.length,'модель','модели','моделей')}`;
  $('#grid').innerHTML = shown.length ? shown.map(card).join('') : `<div class="empty" style="grid-column:1/-1"><h3>Ничего не нашли</h3><p class="mute">Проверьте написание модели или сбросьте фильтры.</p><button class="btn" id="reset">Сбросить фильтры</button></div>`;
  $('#more').innerHTML = L.length > shown.length ? `<button class="btn line" id="moreBtn">Показать ещё ${Math.min(24,L.length-shown.length)}</button>` : '';
  const m=$('#moreBtn'); if(m) m.onclick=()=>{CAT.n+=24; paintCatalog();};
  const r=$('#reset'); if(r) r.onclick=()=>{ location.hash='#/catalog'; route(); };
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.c===CAT.c)));
  document.querySelectorAll('#fb button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.b===CAT.b)));
  document.querySelectorAll('#fs button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.s===CAT.s)));
}
function bindCatalog(){
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{CAT.c=b.dataset.c;CAT.n=24;paintCatalog();});
  let t; $('#fq').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{CAT.q=e.target.value;CAT.n=24;paintCatalog();},180);};
  document.querySelectorAll('#fb button').forEach(b=>b.onclick=()=>{CAT.b=b.dataset.b;CAT.n=24;paintCatalog();});
  document.querySelectorAll('#fs button').forEach(b=>b.onclick=()=>{CAT.s=b.dataset.s;CAT.n=24;paintCatalog();});
  $('#fOpen').onclick=()=>{ $('#side').classList.add('on'); $('#ovl').classList.add('on'); };
  $('#sideX').onclick=closeSide; $('#sideOk').onclick=closeSide;
  paintCatalog();
}
function viewProduct(id){
  const p = BY[id]; if(!p) return `<div class="wrap"><div class="empty" style="margin:30px 0"><h3>Такого товара нет</h3><a class="btn" href="#/catalog">В каталог</a></div></div>`;
  const rel = DATA.items.filter(x=>x.c===p.c && x.id!==p.id).slice(0,4);
  return `<div class="wrap"><div class="crumbs"><a href="#/catalog">Каталог</a> / <a href="#/catalog?c=${p.c}">${esc(catName(p.c))}</a></div>
  <div class="prod"><div class="pic"><div class="stage">${imgTag(p,false)}<span class="tag">${esc(p.b)}</span></div></div>
  <div class="pp"><h1>${esc(p.n)}</h1><p class="sub">Модель ${esc(p.m)} · ${esc(p.b)}</p>
    <div class="big">${rub(p.p)}<small>за штуку</small></div>
    <div class="boxrow"><span>В коробке ${p.k} шт</span><b>Коробка: ${rub(boxSum(p))}</b></div>
    <table class="specs"><tr><td>Бренд</td><td>${esc(p.b)}</td></tr><tr><td>Раздел</td><td>${esc(catName(p.c))}</td></tr><tr><td>Штук в коробке</td><td>${p.k}</td></tr></table>
    <div class="buyrow"><div class="a" data-act="${esc(p.id)}">${actHtml(p.id)}</div><button class="btn lime" id="buyNow">Оформить заявку</button></div>
    <p class="note">Цена за штуку, заказ коробками. Наличие и итоговую сумму подтверждает менеджер.</p></div></div>
  ${rel.length?`<section class="sec"><div class="sec-h"><h2>Похожие товары</h2></div><div class="grid c4">${rel.map(card).join('')}</div></section>`:''}</div>`;
}

/* ---------- router ---------- */
function route(){
  const raw = location.hash.replace(/^#/, '') || '/'; const [path, qs] = raw.split('?'); const params = new URLSearchParams(qs||'');
  const app = $('#app'); let nav='home', title='DSP-JAMAKY — бытовая техника оптом, Москва';
  closeSide();
  if(!DATA.items.length){ app.innerHTML = '<div class="wrap" style="padding:60px 0"><p class="mute">Загружаем каталог…</p></div>'; return; }
  if(path.startsWith('/p/')){ const id=decodeURIComponent(path.slice(3)); app.innerHTML=viewProduct(id); nav='catalog'; if(BY[id]) title=BY[id].n+' '+BY[id].m+' — оптом'; const b=$('#buyNow'); if(b) b.onclick=()=>{ if(!cart[id]) setQty(id,1); openCart(); }; }
  else if(path==='/catalog'){ app.innerHTML=viewCatalog(params); nav='catalog'; title='Каталог — DSP-JAMAKY'; bindCatalog(); }
  else if(path==='/order'){ app.innerHTML=viewOrder(); nav='order'; title='Как заказать — DSP-JAMAKY'; }
  else if(path==='/contacts'){ app.innerHTML=viewContacts(); nav='contacts'; title='Контакты — DSP-JAMAKY'; }
  else { app.innerHTML=viewHome(); const f=$('#heroQ'); f.onsubmit=e=>{e.preventDefault(); const q=f.querySelector('input').value.trim(); location.hash='#/catalog'+(q?'?q='+encodeURIComponent(q):'');}; }
  document.title = title;
  document.querySelectorAll('[data-nav]').forEach(a=>{ if(a.dataset.nav===nav) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  if (tg && tg.BackButton) { try { (path==='/'||path==='') ? tg.BackButton.hide() : tg.BackButton.show(); } catch(e){} }
  window.scrollTo(0,0);
}
if (tg && tg.BackButton) { try { tg.BackButton.onClick(() => { if ($('#drawer').classList.contains('on')) closeCart(); else history.length > 1 ? history.back() : (location.hash = '#/'); }); } catch(e){} }
window.addEventListener('hashchange', route);
fetch('/products.json').then(r=>r.json()).then(d=>{ DATA=d; BY=Object.fromEntries(d.items.map(p=>[p.id,p])); Object.keys(cart).forEach(id=>{ if(!BY[id]) delete cart[id]; }); refresh(); route(); })
  .catch(()=>{ $('#app').innerHTML='<div class="wrap" style="padding:60px 0"><p><b>Не удалось загрузить каталог.</b> Обновите страницу.</p></div>'; });
route();
</script>
</body>
</html>
